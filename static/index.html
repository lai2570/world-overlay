<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>WORLD OVERLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffb020' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/guide.css">
<style>
[hidden]{display:none!important}
/* Screens may grow beyond a short viewport. Clipping here made the last control
   unreachable on small phones and during browser zoom. */
.screen{display:none;min-height:100dvh;height:auto;min-height:100svh;overflow:visible;flex-direction:column}
.screen.on{display:flex}
.landing{position:relative;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(circle at 50% 45%,rgba(95,121,255,.25),transparent 30%),linear-gradient(135deg,#14151d 0%,#314c61 48%,#20232d 100%)}
.landing::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(39,225,198,.24),transparent 28%,transparent 70%,rgba(255,93,142,.18));pointer-events:none}
.landing-shell{position:relative;width:min(1280px,100%);min-height:100svh;margin:auto;padding:20px 32px 32px;display:grid;grid-template-rows:auto auto 1fr;gap:16px}
.landing-nav{display:flex;align-items:center;justify-content:flex-start}.landing-nav b{font-size:15px;letter-spacing:.08em}
.landing-copy{position:relative;z-index:1;width:min(420px,44vw);margin:0 auto;text-align:center}
.landing-copy .home-brand{width:100%;margin:0 auto 8px}.landing-title{margin:0;font-size:clamp(22px,3vw,40px);line-height:1;letter-spacing:-.04em;text-transform:uppercase}.landing-copy p{margin:7px 0 0;color:rgba(247,248,255,.72);font-size:11px}
.landing-workspace{position:relative;display:grid;place-items:center;min-height:clamp(420px,62vh,600px);padding:16px 0}.landing-workspace::before,.landing-workspace::after{position:absolute;top:50%;width:140px;color:rgba(255,255,255,.42);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center}.landing-workspace::before{content:"INPUT";left:13%;transform:translateY(-50%)}.landing-workspace::after{content:"OUTPUT";right:13%;transform:translateY(-50%)}
.landing-upload{position:relative;z-index:2;width:min(560px,55vw);min-height:300px;padding:28px;border:1px solid rgba(255,255,255,.2);border-radius:27px;background:linear-gradient(140deg,rgba(34,48,74,.62),rgba(24,37,59,.36));box-shadow:0 30px 70px rgba(7,10,24,.34),inset 0 1px rgba(255,255,255,.15);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.landing-upload .material-symbols-rounded{font-size:28px}.landing-upload h2{font-size:15px;margin:12px 0 5px}.landing-upload p{max-width:300px;margin:0;color:rgba(247,248,255,.68);font-size:11px}.landing-upload .landing-next{width:80px;margin-top:18px;padding:8px 12px;font-size:12px;border-radius:999px}
.floating-card{position:absolute;width:170px;padding:8px;border-radius:13px;background:rgba(12,17,27,.78);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 30px rgba(0,0,0,.25);backdrop-filter:blur(12px);transform:rotate(var(--r));z-index:1}.floating-card img{display:block;width:100%;height:94px;object-fit:cover;border-radius:9px}.floating-card span{display:block;margin:8px 3px 2px;color:rgba(255,255,255,.76);font-size:10px}.floating-card.left-top{left:0;top:22%;--r:-9deg}.floating-card.left-bottom{left:20px;bottom:10%;--r:9deg}.floating-card.right-top{right:0;top:18%;--r:7deg}.floating-card.right-bottom{right:14px;bottom:9%;--r:-7deg}
.demo-launch{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,79,134,.92);color:#111;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.stepper{display:none}.flow-back{align-self:flex-start;color:var(--mute);background:none;padding:4px 0;font-size:13px}
.hero{width:min(1080px,100%);margin:auto;padding:clamp(24px,5vh,72px) 24px 24px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.home-brand{width:min(520px,86vw);margin:0 auto 8px;filter:drop-shadow(0 16px 38px rgba(49,214,208,.16))}
.home-brand img{display:block;width:100%;height:auto}
.home-kicker{text-align:center;color:var(--mute);font-size:clamp(14px,2vw,18px);letter-spacing:.08em;text-transform:uppercase}
.hero h1{margin:0;font-size:28px;letter-spacing:.06em}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang{display:flex;gap:4px}
.lang button{flex:none;padding:5px 11px;font-size:13px;font-weight:400;border-radius:999px;background:none;color:var(--mute);border:1px solid #3a404a}
.lang button.on{color:var(--fg);border-color:var(--a)}
.hero p{margin:0;color:var(--mute)}
.label{font-size:14px;color:var(--mute);margin:6px 0 -4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;border:2px dashed #3a404a;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--mute);font-size:13px;text-align:center;overflow:hidden;cursor:pointer;gap:2px}
.tile b{color:var(--fg);font-size:22px;font-weight:400}
.tile.filled{border-style:solid;border-color:#3a404a}
.tile.manual.filled{border-color:var(--b)}
.tile .pages{position:absolute;inset:auto 5px 5px 5px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:1px 7px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 全部步驟完成：蓋在動畫上 */
#doneView{position:absolute;inset:0;z-index:7;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:radial-gradient(ellipse at 60% 45%,#2a2f37,#14171c 75%);text-align:center}
#doneView img{max-width:100%;min-height:0;flex:1 1 auto;object-fit:contain;border-radius:10px}
#doneView b{font-size:20px}
#doneView .row{display:flex;gap:10px;width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .v{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:0 7px;border-radius:8px}
.tile .n{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:0 7px;border-radius:8px}
.tile .x{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;flex:none;font-weight:400}
input[type=file]{display:none}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.upload-panel{width:min(620px,100%);margin:0 auto;padding:clamp(24px,5vw,52px);border:1px solid rgba(255,255,255,.16);border-radius:28px;background:linear-gradient(145deg,rgba(24,33,58,.94),rgba(14,18,35,.94));box-shadow:0 24px 70px rgba(0,0,0,.28)}
.upload-panel .tile{min-height:220px;aspect-ratio:auto;border-color:rgba(49,214,208,.72);border-radius:20px;background:rgba(8,11,22,.36);font-size:15px}
.upload-panel .tile b{font-size:48px;color:var(--b)}
.upload-panel #manualGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.upload-panel #manualGrid .tile{min-height:190px}
.step-section{display:none}
.step-section.on{display:block}
.actions{display:none;margin-top:auto;padding:16px 20px calc(20px + env(safe-area-inset-bottom));flex-direction:column;gap:10px}
.actions.on{display:flex}
.btn{display:block;text-align:center;padding:16px;border-radius:14px;font-weight:700;font-size:17px;border:0;background:#2a2f37;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--a);color:#111}
.btn:disabled{opacity:.4}
/* 分析中 */
.progress{padding:20px}
.progress h2{margin:0 0 4px;font-size:20px}
.progress .timer{color:var(--mute);font-size:14px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px}
.thumbs img{height:64px;border-radius:8px;opacity:.7}
.log{list-style:none;margin:12px 0 0;padding:0;font-size:15px}
.log li{padding:5px 0;color:var(--mute)}
.log li::before{content:"✓ ";color:#4ade80}
.log li:last-child{color:var(--fg)}
.log li:last-child::before{content:"⋯ ";color:var(--a)}
.err{color:#f87171;margin-top:10px}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:84px;flex-direction:row;gap:10px;padding:10px}
.tile.wide.filled{border-color:var(--a);aspect-ratio:16/9}
.or{text-align:center;color:var(--mute);font-size:13px;margin:2px 0 -2px}
/* 動畫 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left)) 8px;font-size:13px;color:var(--mute);gap:12px;flex-wrap:wrap}
.topbar b{color:var(--fg);letter-spacing:.08em}
.topbar button{flex:none;background:none;border:1px solid #3a404a;color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:400}
@media (max-width:440px){.topbar>b{font-size:12px}.topbar{justify-content:space-between}.topbar .tools{margin-left:auto}}
@media (max-width:560px){.hero{padding:18px 16px 16px;gap:12px}.home-brand{width:min(410px,88vw)}.upload-panel{padding:18px 14px;border-radius:22px}.upload-panel #manualGrid .tile{min-height:138px}.upload-panel .tile b{font-size:38px}.label{font-size:12px}}
@media (max-width:760px){.landing-shell{padding:14px 16px 96px}.landing-copy{width:min(360px,90vw);margin:0 auto}.landing-copy .home-brand{width:100%}.landing-workspace{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;padding:12px 0 0;gap:16px}.landing-upload{order:1;grid-column:1/-1;width:100%;min-height:250px;padding:22px}.floating-card{position:relative;inset:auto!important;width:100%;transform:none!important;margin:0!important}.floating-card img{height:88px}.landing-workspace::before,.landing-workspace::after{display:none}.landing-nav{margin-bottom:0}.demo-launch{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom))}}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.stage-wrap,#stage{width:min(960px,calc(100% - 24px));margin-inline:auto}
.card{width:min(960px,100%);}
.btn,.nav button,.topbar button,.demo-launch,.tile{min-height:44px}
.goal{padding:0 16px 8px;font-size:13px;color:var(--mute)}
.stage-wrap{position:relative;margin:0 12px}
#stage{position:relative;height:clamp(320px,min(62vh,560px),560px);border-radius:16px;overflow:hidden;
  background:radial-gradient(ellipse at 60% 45%,#2a2f37,#14171c 75%)}
.asm{position:absolute;object-fit:contain;user-select:none;pointer-events:none}
.asm.r,.asm.b:not(.cut){border-radius:10px}
.asm.a{filter:drop-shadow(0 0 5px var(--a)) drop-shadow(0 0 14px var(--a));z-index:3}
.asm.b.cut{filter:drop-shadow(0 0 5px var(--b)) drop-shadow(0 0 12px var(--b))}
.asm.r{z-index:4}
.asm-ov{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;transition:opacity .2s}
/* 3D 檢視（models3d.js）：蓋在動畫上，A 在上、B 在下 */
#view3d{position:absolute;inset:0;z-index:6;border-radius:16px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr;gap:2px;
  background:radial-gradient(ellipse at 60% 45%,#2a2f37,#14171c 75%)}
#view3d .pane{position:relative;min-height:0}
#view3d .chip{position:absolute;left:10px;top:8px;z-index:1}
#view3d model-viewer{width:100%;height:100%;--poster-color:transparent}
#view3d .wait{margin:0;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;padding:0 16px;text-align:center}
.gen-tip{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;text-align:center;font-size:13px;background:rgba(0,0,0,.65);padding:6px 10px;border-radius:10px}
.nav button.small{flex:.6}
button.tile{background:none;font:inherit;color:var(--mute);flex:none;font-weight:400;padding:10px}
#recTile{grid-column:span 2;aspect-ratio:auto;min-height:118px;border-color:var(--a);border-style:solid}
#recTile b{font-size:26px}
#allPick{aspect-ratio:auto;min-height:118px}
/* App 內錄影 */
#rec{position:fixed;inset:0;background:#000;z-index:20}
#recView{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rec-hint{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:rgba(0,0,0,.6);
  color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:12px}
.rec-time{position:absolute;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));text-align:center;color:#fff;
  font-size:20px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
.rec-time.on::before{content:"● ";color:#f43f5e}
.rec-bar{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around}
.rec-bar button{flex:none;background:rgba(0,0,0,.55);color:#fff;border:1px solid #fff6;border-radius:999px;padding:10px 16px;font-size:15px;min-width:76px}
#recGo{width:78px;height:78px;min-width:0;padding:0;border-radius:50%;border:5px solid #fff;background:#f43f5e}
#recGo.on{background:#fff}
#recGo.on::after{content:"";display:block;width:26px;height:26px;margin:auto;background:#f43f5e;border-radius:5px}
/* 即時辨識 */
#seek{position:fixed;inset:0;background:#000;z-index:20}
#seekView{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.reticle{position:absolute;left:50%;top:38%;width:min(70vw,52vh);aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid var(--a);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);pointer-events:none;transition:border-color .2s}
.reticle.sure{border-color:#4ade80}
.seek-top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12px}
.seek-top button{flex:none;background:rgba(0,0,0,.55);color:#fff;border:1px solid #fff6;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:400}
.seek-card{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(16,18,22,.92);
  border-radius:16px;padding:12px 14px;color:var(--fg);font-size:15px;line-height:1.45}
.seek-card .who{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.seek-card .who img{width:54px;height:54px;object-fit:contain;background:#2a2f37;border-radius:10px}
.seek-card .tag{font-size:12px;font-weight:400;padding:1px 8px;border-radius:999px;background:#2a2f37;color:var(--mute)}
.seek-card .tag.ok{background:#14532d;color:#bbf7d0}
.seek-card .to{display:flex;gap:10px;align-items:center;margin-top:10px}
.seek-card .to img{width:84px;height:84px;object-fit:contain;background:#2a2f37;border-radius:10px;flex:none}
.seek-card .alt{color:var(--mute);font-size:13px;margin-top:6px}
.seek-card .go{margin-top:10px;width:100%}
</style></head><body>

<!-- 1. 拍照 -->
<section class="screen on" id="landing">
  <div class="landing-shell">
    <div class="landing-nav"><b>WORLD OVERLAY</b></div>
    <div class="landing-copy"><div class="home-brand"><img src="/static/world-overlay-logo.svg" alt="World Overlay"></div><p data-i18n="landingCopy"></p></div>
    <div class="landing-workspace">
      <div class="floating-card left-top"><img src="/static/demo-manual.svg" alt="Microphone manual"><span data-i18n="demoManual"></span></div>
      <div class="floating-card left-bottom"><img src="/static/demo-parts.svg" alt="Microphone parts"><span data-i18n="demoParts"></span></div>
      <div class="landing-upload"><span class="material-symbols-rounded">add</span><h2 data-i18n="uploadPrompt"></h2><p data-i18n="uploadHint"></p><button class="btn primary landing-next" id="startFlow" data-i18n="startFlow"></button></div>
      <div class="floating-card right-top"><img src="/static/demo-assembly.svg" alt="Microphone assembly animation"><span data-i18n="demoAnimation"></span></div>
      <div class="floating-card right-bottom"><img src="/static/demo-3d.svg" alt="Microphone 3D guide"><span data-i18n="demo3d"></span></div>
    </div>
    <button class="demo-launch" id="demoLaunch"><span class="material-symbols-rounded">play_arrow</span><span data-i18n="demoLaunch"></span></button>
  </div>
</section>

<section class="screen" id="home">
  <div class="stepper" aria-label="Progress"><div class="step-item on" id="stepOne"><span class="step-dot">1</span><span data-i18n="stepManual"></span></div><span class="step-line"></span><div class="step-item" id="stepTwo"><span class="step-dot">2</span><span data-i18n="stepParts"></span></div><span class="step-line"></span><div class="step-item"><span class="step-dot">3</span><span data-i18n="stepResult"></span></div></div>
  <div class="hero">
    <div class="hero-top"><button class="flow-back" id="backLanding"><span class="material-symbols-rounded">arrow_back</span></button><div class="lang"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div></div>
    <div class="home-brand"><img src="/static/world-overlay-logo.svg" alt="World Overlay"></div>
    <div class="home-kicker" data-i18n="homeKicker"></div>
    <div class="upload-panel">
      <div class="label" data-i18n="manualLabel"></div>
      <div class="grid" id="manualGrid"><label class="tile" id="manualTile" for="manualIn" data-i18n-html="manualTile"></label><label class="tile" id="pdfTile" for="pdfIn" data-i18n-html="pdfTile"></label></div>
      <div class="step-section" id="partsStep">
        <div class="label" data-i18n="partsLabel"></div>
        <div class="grid" id="allRow"><button class="tile half" id="recTile"><b class="material-symbols-rounded">videocam</b><span data-i18n-html="recTile"></span></button><label class="tile half" id="allPick" for="allIn"><b class="material-symbols-rounded">movie</b><small data-i18n="allPick"></small></label><div class="tile wide filled" id="allTile" hidden></div></div>
        <div class="or" id="orLine" data-i18n="orLine"></div>
      <div class="grid" id="partsGrid"><label class="tile" id="addTile" for="partsIn" data-i18n-html="addTile"></label><label class="tile" id="vidTile" for="vidIn" data-i18n-html="vidTile"></label></div>
      </div>
    </div>
    <button class="btn primary" id="nextStep" data-i18n="nextStep"></button>
  </div>
  <div class="actions" id="homeActions">
    <button class="btn primary" id="go" disabled></button>
    <button class="btn" id="sample" data-i18n="sample"></button>
    <input type="file" id="manualIn" accept="image/*" multiple>
    <input type="file" id="pdfIn" accept="application/pdf,.pdf">
    <input type="file" id="partsIn" accept="image/*" multiple>
    <input type="file" id="vidIn" accept="video/*">
    <input type="file" id="allIn" accept="video/*">
  </div>
</section>

<!-- 1b. App 內錄影 -->
<section class="screen" id="rec">
  <video id="recView" autoplay muted playsinline></video>
  <div class="rec-hint" data-i18n-html="recHint"></div>
  <div class="rec-time" id="recTime"></div>
  <div class="rec-bar"><button id="recCancel" data-i18n="cancel"></button><button id="recGo" data-i18n-label="recGo"></button><span style="min-width:76px"></span></div>
</section>

<!-- 2. 分析中 -->
<section class="screen" id="busy">
  <div class="progress">
    <h2 data-i18n="busy"></h2>
    <div class="timer" id="timer"></div>
    <div class="thumbs" id="thumbs"></div>
    <ul class="log" id="log"></ul>
    <div class="err" id="err"></div>
    <div class="nav" id="errNav" hidden><button id="retry" data-i18n="home"></button></div>
  </div>
</section>

<!-- 3. 組裝動畫 -->
<section class="screen" id="play">
  <div class="topbar"><b>WORLD OVERLAY</b><span style="display:flex;gap:6px"><button id="btn3d" hidden>3D</button><button id="seekBtn" data-i18n="seekBtn"></button><button id="again" data-i18n="again"></button></span></div>
  <div class="goal" id="goal"></div>
  <div class="stage-wrap"><div id="stage"></div><div id="view3d" hidden></div><div class="gen-tip" id="genTip" hidden data-i18n="genTip"></div><div id="doneView" hidden><img id="doneImg" alt=""><b data-i18n="allDone"></b><div class="row"><button id="doneReplay" data-i18n="watchAgain"></button><button class="primary" id="doneNew" data-i18n="again"></button></div></div></div>
  <div class="card">
    <div class="count" id="count"></div>
    <div class="pair"><span class="chip a" id="pa"></span><span class="material-symbols-rounded">arrow_forward</span><span class="chip b" id="pb"></span></div>

  </div>
</section>

<!-- 4. 即時辨識：鏡頭對著零件 → 這是哪個、要接到哪個 -->
<section class="screen" id="seek">
  <video id="seekView" autoplay muted playsinline></video>
  <div class="reticle" id="reticle"></div>
  <div class="seek-top"><button id="seekBack" data-i18n="seekBack"></button><span id="seekMs"></span></div>
  <div class="seek-card" id="seekCard" data-i18n="seekInit"></div>
</section>

<script src="/static/i18n.js"></script>
<script src="/static/assemble.js"></script>
<script src="/static/models3d.js"></script>
<script>
const $ = id => document.getElementById(id);
const MAX_SIDE = 1280, MANUAL_MAX_SIDE = 1600, MAX_PARTS = 10;  // 和後端一致
const VIDEO_MAX_MB = 60, VIDEO_MAX_SEC = 15;  // 後端只取前 8 秒；4K 影片很大，先擋掉
const ALL_MAX_MB = 500, ALL_MAX_SEC = 150;    // 一段影片錄全部零件（原檔直接上傳）
const REC_BPS = 2500000;  // App 內錄影：約 720p、每秒 2.5 Mb，60 秒約 19 MB（手機相機 1080p 約 5 倍大）
let timerId = null, pollId = null, player = null, currentJob = null, currentResult = null;
let models3d = null, stepNow = 0;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}

function passcodeHeaders() {
  let code = null;
  try { code = localStorage.getItem("passcode"); } catch (e) {}
  return code ? {"X-Passcode": code} : {};
}

async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {...(opts.headers || {}), ...passcodeHeaders(), "X-Lang": LANG}});
  if (res.status === 401) {
    const code = prompt(t("passcode"));
    if (code) { try { localStorage.setItem("passcode", code); } catch (e) {} return api(path, opts); }
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// 縮小再上傳，順便依 EXIF 轉正（瀏覽器畫進 canvas 時會套用方向）
async function fileToDataUrl(file, maxSide) {
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", 0.88);
}

// 影片縮圖（取 at 秒那一格）和長度；格式讀不了或太長就丟錯誤
async function videoThumb(file, maxSec, tooLong, at = 0.5) {
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto";
  v.src = URL.createObjectURL(file);
  try {
    await new Promise((ok, bad) => { v.onloadeddata = ok; v.onerror = () => bad(new Error(t("badVideo"))); });
    if (v.duration > maxSec) throw new Error(tooLong);
    v.currentTime = Math.min(at, v.duration / 2);
    await new Promise(ok => v.onseeked = ok);
    const c = document.createElement("canvas"), k = Math.min(1, 320 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return {thumb: c.toDataURL("image/jpeg", 0.8), seconds: v.duration};
  } finally { URL.revokeObjectURL(v.src); }
}

// 影片原檔上傳（後端用 ffmpeg 轉檔）
async function videoToPart(file) {
  if (file.size > VIDEO_MAX_MB * 1024 * 1024) throw new Error(t("clipTooBig", VIDEO_MAX_MB));
  const {thumb} = await videoThumb(file, VIDEO_MAX_SEC, t("clipTooLong", VIDEO_MAX_SEC));
  const data = await new Promise((ok, bad) => {
    const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(r.error); r.readAsDataURL(file);
  });
  // 有些手機給的 MIME 是空的或 application/octet-stream，後端靠 data:video/ 判斷
  return {data: data.replace(/^data:[^;,]*/, "data:" + (file.type.startsWith("video/") ? file.type : "video/mp4")),
          thumb, video: true};
}

// ---------- 拍照 ----------
const MANUAL_MAX_PAGES = 20;  // 說明書照片和 PDF 頁數加起來最多幾頁（和後端一致）
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let manuals = [], all = null;  // manuals：[{thumb, pages: [data URL...], pdf: 檔名, total: PDF 總頁數}]；all：一段影片錄全部零件 {file, thumb, seconds}
const manualPages = () => manuals.flatMap(m => m.pages);
const parts = [];  // {data: 上傳用的 data URL, thumb: 縮圖, video: 是不是影片}
let homeStep = 1;
function updateHomeStep() {
  const advanced = homeStep > 1;
  $("partsStep").classList.toggle("on", advanced);
  $("nextStep").hidden = advanced;
  $("nextStep").textContent = t("nextStep");
  $("homeActions").classList.toggle("on", advanced);
  $("stepOne").classList.toggle("on", !advanced);
  $("stepOne").classList.toggle("done", advanced);
  $("stepTwo").classList.toggle("on", advanced);
}

function renderTiles() {
  const mg = $("manualGrid");
  mg.querySelectorAll(".tile.filled").forEach(el => el.remove());
  manuals.forEach((m, n) => {
    const tile = document.createElement("div"); tile.className = "tile manual filled";
    const im = document.createElement("img"); im.src = m.thumb;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", t("removeManual"));
    x.onclick = () => { manuals.splice(n, 1); renderTiles(); };
    tile.append(im, x);
    if (m.pdf) tile.append(Object.assign(document.createElement("span"), {className: "pages",
      textContent: t("pdfPages", m.pages.length, m.total)}));
    mg.insertBefore(tile, $("manualTile"));
  });
  $("manualTile").hidden = $("pdfTile").hidden = manualPages().length >= MANUAL_MAX_PAGES;
  mg.append($("manualTile"), $("pdfTile"));
  const at = $("allTile");
  at.hidden = !all; $("recTile").hidden = $("allPick").hidden = !!all;
  at.replaceChildren();
  if (all) {
    const im = document.createElement("img"); im.src = all.thumb;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", t("removeVideo"));
    x.onclick = e => { e.preventDefault(); all = null; renderTiles(); };
    const v = Object.assign(document.createElement("span"), {className: "v", textContent: t("videoSecs", Math.round(all.seconds))});
    at.append(im, v, x);
  }
  // 整段影片和一個一個拍二選一
  $("orLine").hidden = $("partsGrid").hidden = !!all;
  $("allRow").hidden = parts.length > 0;
  const grid = $("partsGrid");
  grid.querySelectorAll(".tile.filled").forEach(t => t.remove());
  parts.forEach((p, n) => {
    const tile = document.createElement("div"); tile.className = "tile filled";
    const im = document.createElement("img"); im.src = p.thumb;
    const num = document.createElement("span"); num.className = "n"; num.textContent = n + 1;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", t("removePart", n + 1));
    x.onclick = () => { parts.splice(n, 1); renderTiles(); };
    tile.append(im, num, x);
    if (p.video) tile.append(Object.assign(document.createElement("span"), {className: "v", textContent: t("videoTag")}));
    grid.insertBefore(tile, $("addTile"));
  });
  $("addTile").hidden = $("vidTile").hidden = parts.length >= MAX_PARTS;
  grid.append($("addTile"), $("vidTile"));
  $("go").disabled = !all && parts.length < 2;
  const m = t(manuals.length ? "goWithManual" : "goNoManual");
  $("go").textContent = all ? t("goVideo", m) : parts.length < 2 ? t("goNeed2") : t("goParts", m, parts.length);
}

$("manualIn").onchange = async e => {
  const files = [...e.target.files].slice(0, MANUAL_MAX_PAGES - manualPages().length); e.target.value = "";
  for (const f of files) { const data = await fileToDataUrl(f, MANUAL_MAX_SIDE); manuals.push({thumb: data, pages: [data]}); }
  renderTiles();
};

// PDF 說明書：在手機上用 pdf.js 把每一頁畫成圖，和說明書照片一樣上傳（後端不用處理 PDF）
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, bad) => {
    const s = Object.assign(document.createElement("script"), {src: PDFJS + "pdf.min.js"});
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(pdfjsLib); };
    s.onerror = () => bad(new Error(t("pdfFailed")));
    document.head.appendChild(s);
  });
}

$("pdfIn").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const tile = $("pdfTile"), label = tile.innerHTML;
  try {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({data: await f.arrayBuffer()}).promise;
    const n = Math.min(doc.numPages, MANUAL_MAX_PAGES - manualPages().length), pages = [];
    for (let i = 1; i <= n; i++) {
      tile.textContent = t("pdfReading", i, n);
      const page = await doc.getPage(i), v = page.getViewport({scale: 1});
      const vp = page.getViewport({scale: MANUAL_MAX_SIDE / Math.max(v.width, v.height)});
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);  // 透明背景的 PDF 轉 JPEG 會變黑
      await page.render({canvasContext: g, viewport: vp}).promise;
      pages.push(c.toDataURL("image/jpeg", 0.85));
    }
    if (pages.length) manuals.push({thumb: pages[0], pages, pdf: f.name, total: doc.numPages});
    if (doc.numPages > n) alert(t("pdfTruncated", n, doc.numPages));
  } catch (err) { alert(err.message || t("pdfFailed")); }
  tile.innerHTML = label;
  renderTiles();
};
$("partsIn").onchange = async e => {
  const files = [...e.target.files].slice(0, MAX_PARTS - parts.length); e.target.value = "";
  for (const f of files) { const data = await fileToDataUrl(f, MAX_SIDE); parts.push({data, thumb: data, video: false}); }
  renderTiles();
};
$("vidIn").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || parts.length >= MAX_PARTS) return;
  try { parts.push(await videoToPart(f)); renderTiles(); } catch (err) { alert(err.message); }
};

$("allIn").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    if (f.size > ALL_MAX_MB * 1024 * 1024) throw new Error(t("allTooBig", ALL_MAX_MB));
    const {thumb, seconds} = await videoThumb(f, ALL_MAX_SEC, t("allTooLong", ALL_MAX_SEC), 2);
    all = {file: f, thumb, seconds}; renderTiles();
  } catch (err) { alert(err.message); }
};

// ---------- App 內錄影 ----------
// 用 MediaRecorder 直接錄低位元率的影片，比手機相機 App 錄的檔案小很多；需要 HTTPS（通道或 --https）
let rec = null;  // {stream, mr, chunks, t0, tick, thumb, cancel}

function recMime() {
  if (!window.MediaRecorder) return null;
  return ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
    .find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function grabFrame() {
  const v = $("recView"), c = document.createElement("canvas"), k = Math.min(1, 320 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}

function closeRecorder() {
  if (!rec) return;
  clearInterval(rec.tick);
  rec.stream.getTracks().forEach(t => t.stop());
  $("recView").srcObject = null;
  rec = null;
  show("home");
}

$("recTile").onclick = async () => {
  if (!navigator.mediaDevices?.getUserMedia || recMime() === null)
    return alert(t("noRecorder"));
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}});
    rec = {stream};
    $("recView").srcObject = stream;
    $("recGo").classList.remove("on"); $("recTime").classList.remove("on");
    $("recTime").textContent = t("recStart", ALL_MAX_SEC);
    show("rec");
  } catch (e) {
    alert(t("noCamera", e.message));
  }
};

$("recGo").onclick = () => {
  if (!rec) return;
  if (rec.mr) {  // 錄影中：停止
    if (Date.now() - rec.t0 < 3000) return;
    return rec.mr.stop();
  }
  const type = recMime();
  const mr = new MediaRecorder(rec.stream, {...(type ? {mimeType: type} : {}), videoBitsPerSecond: REC_BPS});
  Object.assign(rec, {mr, chunks: [], t0: Date.now(), thumb: null});
  mr.ondataavailable = e => e.data.size && rec && rec.chunks.push(e.data);
  mr.onstop = () => {
    if (!rec || rec.cancel) return closeRecorder();
    const mime = (mr.mimeType || type || "video/webm").split(";")[0];
    const file = new File(rec.chunks, `parts.${mime.includes("mp4") ? "mp4" : "webm"}`, {type: mime});
    all = {file, thumb: rec.thumb || grabFrame(), seconds: (Date.now() - rec.t0) / 1000};
    closeRecorder();
    renderTiles();
  };
  mr.start(1000);
  $("recGo").classList.add("on"); $("recTime").classList.add("on");
  rec.tick = setInterval(() => {
    const s = (Date.now() - rec.t0) / 1000;
    $("recTime").textContent = t("recStop", `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`);
    if (!rec.thumb && s > 1.5) rec.thumb = grabFrame();
    if (s >= ALL_MAX_SEC && mr.state === "recording") mr.stop();
  }, 250);
};

$("recCancel").onclick = () => {
  if (rec?.mr && rec.mr.state === "recording") { rec.cancel = true; rec.mr.stop(); }
  else closeRecorder();
};

// 大檔案用 XHR 才看得到上傳進度
function uploadVideo(file, onProgress) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/video");
    x.setRequestHeader("Content-Type", file.type || "video/mp4");
    for (const [k, v] of Object.entries({...passcodeHeaders(), "X-Lang": LANG})) x.setRequestHeader(k, v);
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 401) {
        const code = prompt(t("passcode"));
        if (code) { try { localStorage.setItem("passcode", code); } catch (e) {} return uploadVideo(file, onProgress).then(ok, bad); }
      }
      if (x.status === 413 || x.status === 524) return bad(new Error(t("tunnelLimit")));
      x.status === 200 ? ok(d.video) : bad(new Error(d.error || t("uploadFailed", x.status)));
    };
    x.onerror = () => bad(new Error(t("uploadDropped")));
    x.send(file);
  });
}

// ---------- 分析 ----------
function addLog(msg) {
  const li = document.createElement("li");
  li.textContent = msg;
  $("log").appendChild(li);
}

function fail(msg) {
  clearInterval(timerId); clearInterval(pollId);
  $("err").textContent = t("failed", msg);
  $("errNav").hidden = false;
}

async function analyze() {
  $("log").replaceChildren(); $("err").textContent = ""; $("errNav").hidden = true;
  $("thumbs").replaceChildren(...(all ? [all] : parts).map(p => Object.assign(document.createElement("img"), {src: p.thumb})));
  show("busy");
  const t0 = Date.now();
  clearInterval(timerId);
  $("timer").textContent = t("seconds", 0);
  timerId = setInterval(() => $("timer").textContent = t("seconds", Math.round((Date.now() - t0) / 1000)), 500);
  try {
    let body;
    if (all) {
      const mb = t("uploadVideo", (all.file.size / 1024 / 1024).toFixed(0));
      addLog(mb);
      const li = $("log").lastChild;
      await api("/api/ping");  // 先確認通行碼，免得大檔案傳完才被擋
      const video = await uploadVideo(all.file, f => li.textContent = `${mb} ${Math.round(f * 100)}%`);
      body = {manual: manualPages(), video, lang: LANG};
    } else {
      addLog(t("uploadPhotos", manuals.length > 0, parts.some(p => p.video)));
      body = {manual: manualPages(), parts: parts.map(p => p.data), lang: LANG};
    }
    const {job} = await api("/api/assemble", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)});
    poll(job);
  } catch (e) { fail(e.message); }
}

// 第一步的資料一到就開始播；後面的組裝結果圖陸續補上
function poll(job) {
  let seen = 0, version = 0;
  currentJob = job;
  clearInterval(pollId);
  pollId = setInterval(async () => {
    let j;
    try { j = await api(`/api/job?id=${job}&v=${version}`); } catch (e) { return; }  // 網路抖一下就下次再試
    for (; seen < j.log.length; seen++) addLog(j.log[seen]);
    if (j.result) {
      version = j.version;
      if (!player) play(j.result); else { player.update(j.result); currentResult = j.result; }
    }
    if (j.status === "done") { clearInterval(pollId); clearInterval(timerId); }
    if (j.status === "error") { if (player) { clearInterval(pollId); } else fail(j.error); }
  }, 1000);
}

function play(result) {
  if (!result.steps.length) return fail(t("noSteps"));
  currentResult = result;
  clearInterval(timerId);
  $("goal").textContent = t("goal", result.goal);
  show("play");
  stepNow = 0;
  player = startAssembly(result, i => { stepNow = i; models3d && models3d.step(); });
  window.player = player;
  models3d && models3d.stop();
  // 3D 開著時停掉底下的平面動畫，關掉時從這一步重播
  models3d = startModels(currentJob, () => currentResult.steps[stepNow], on => on ? player.stop() : player.goto(stepNow));
}

// ---------- 即時辨識 ----------
// 每 0.3 秒左右把框裡的畫面送給電腦（DINOv2 比對，約 0.3–0.5 秒），連續兩次一樣才換顯示；
// 不確定（前兩名分數接近）時請 Muse Spark 確認，確認過的結果優先
let seek = null;  // {stream, on, recent: [], confirmed: {name, cands, at}, confirming}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function grabCenter() {
  const v = $("seekView"), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  // 畫面用 object-fit: cover 顯示，框在畫面寬 70%（或高 52%）、垂直 38% 的位置：換算回影片座標
  const W = v.clientWidth, H = v.clientHeight, k = Math.max(W / vw, H / vh);
  const side = Math.min(W * .7, H * .52) / k, cx = vw / 2 + (W / 2 - W / 2) / k, cy = vh / 2 + (H * .38 - H / 2) / k;
  const c = document.createElement("canvas"); c.width = c.height = 448;
  c.getContext("2d").drawImage(v, cx - side / 2, cy - side / 2, side, side, 0, 0, 448, 448);
  return c.toDataURL("image/jpeg", 0.8);
}

function partCard(name, tag, alts) {
  const D = currentResult, card = $("seekCard");
  const img = D.images[`part:${name}`];
  const k = D.steps.findIndex(s => s.part_a === name);
  const kb = D.steps.findIndex(s => s.part_b === name && !s.onto_step);
  card.replaceChildren();
  const who = document.createElement("div"); who.className = "who";
  if (img) who.append(Object.assign(document.createElement("img"), {src: img}));
  who.append(Object.assign(document.createElement("span"), {textContent: t("thisIs", name)}));
  if (tag) who.append(Object.assign(document.createElement("span"), {className: "tag" + (tag.ok ? " ok" : ""), textContent: tag.text}));
  card.append(who);
  let step = -1;
  if (k >= 0) {
    const s = D.steps[k]; step = k;
    const to = document.createElement("div"); to.className = "to";
    const bImg = D.images[s.b_img];
    if (bImg) to.append(Object.assign(document.createElement("img"), {src: bImg}));
    const d = document.createElement("div");
    d.innerHTML = `<b>${t("stepOnto", k + 1)}</b><br><span class="i"></span>`;
    d.querySelector(".chip").textContent = s.onto_step ? t("assemblyOf", s.onto_step) : s.part_b;
    d.querySelector(".i").textContent = s.instruction;
    to.append(d);
    if (s.result && D.images[s.result]) to.append(Object.assign(document.createElement("img"), {src: D.images[s.result], title: t("doneLook")}));
    card.append(to);
  } else if (kb >= 0) {
    step = kb;
    card.append(Object.assign(document.createElement("div"), {className: "alt",
      textContent: t("laterOnto", kb + 1, D.steps[kb].part_a)}));
  } else {
    card.append(Object.assign(document.createElement("div"), {className: "alt", textContent: t("unused")}));
  }
  if (alts && alts.length) card.append(Object.assign(document.createElement("div"), {className: "alt", textContent: t("maybe", alts)}));
  if (step >= 0) {
    const b = Object.assign(document.createElement("button"), {className: "go primary", textContent: t("watchStep", step + 1)});
    b.onclick = () => { stopSeek(); show("play"); player.goto(step); };
    card.append(b);
  }
}

async function confirmPart(image, cands) {
  if (seek.confirming) return;
  seek.confirming = true;
  try {
    const r = await api("/api/confirm", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({job: currentJob, image, candidates: cands})});
    if (seek && r.name) seek.confirmed = {name: r.name, cands, at: Date.now()};
  } catch (e) {} finally { if (seek) seek.confirming = false; }
}

async function seekLoop() {
  while (seek && seek.on) {
    const t0 = Date.now(), image = grabCenter();
    if (!image) { await sleep(200); continue; }
    let r;
    try {
      r = await api("/api/identify", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({job: currentJob, image})});
    } catch (e) {
      $("seekCard").textContent = t("identifyFailed", e.message);
      await sleep(1500); continue;
    }
    if (!seek || !seek.on) break;
    $("seekMs").textContent = `${r.ms} ms`;
    const names = r.top.map(m => m[0]), top = names[0];
    seek.recent = [...seek.recent.slice(-1), top];
    const stable = seek.recent.length === 2 && seek.recent[0] === seek.recent[1];
    const c = seek.confirmed;
    $("reticle").classList.toggle("sure", stable && r.sure);
    if (c && Date.now() - c.at < 6000 && names.includes(c.name) && !(r.sure && top !== c.name)) {
      partCard(c.name, {text: t("sparkSure"), ok: true});
    } else if (stable && r.sure) {
      partCard(top, {text: t("sure"), ok: true});
    } else if (stable) {
      partCard(top, {text: t("checking")}, names.slice(1, 3));
      confirmPart(image, names);
    }
    await sleep(Math.max(0, 300 - (Date.now() - t0)));
  }
}

async function startSeek() {
  if (!currentJob || !currentResult) return;
  if (!navigator.mediaDevices?.getUserMedia) return alert(t("noCameraHttps"));
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}});
    player && player.stop();
    seek = {stream, on: true, recent: [], confirmed: null, confirming: false};
    $("seekView").srcObject = stream;
    $("seekCard").textContent = t("seekFirst");
    $("reticle").classList.remove("sure");
    show("seek");
    seekLoop();
  } catch (e) {
    alert(t("noCamera", e.message));
  }
}

function stopSeek() {
  if (!seek) return;
  seek.on = false;
  seek.stream.getTracks().forEach(t => t.stop());
  $("seekView").srcObject = null;
  seek = null;
}

$("seekBtn").onclick = startSeek;
$("seekBack").onclick = () => { stopSeek(); show("play"); player && player.goto(0); };

$("go").onclick = analyze;
$("sample").onclick = async () => {
  try { const {result, job} = await api(`/api/parts_sample?lang=${LANG}`); player = null; currentJob = job; play(result); }
  catch (e) { alert(t("sampleFailed", e.message)); }
};
$("doneReplay").onclick = () => player && player.goto(0);
$("doneNew").onclick = () => $("again").click();
$("again").onclick = $("retry").onclick = () => {
  clearInterval(pollId); clearInterval(timerId); stopSeek();
  player && player.stop(); player = null;
  models3d && models3d.stop(); models3d = null;
  homeStep = 1; updateHomeStep(); show("home");
};
// 換語言：只有首頁能換（分析結果是用當時的語言寫的）
$("nextStep").onclick = () => { homeStep = 2; updateHomeStep(); };
$("startFlow").onclick = () => show("home");
$("demoLaunch").onclick = () => {
  const sample = $("sample");
  if (sample) sample.click();
};
$("backLanding").onclick = () => { homeStep = 1; updateHomeStep(); show("landing"); };
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { setLang(b.dataset.lang); renderTiles(); });
applyI18n();
renderTiles();
updateHomeStep();
</script>
